name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v2.1.0)
  workflow_dispatch: # Allow manual trigger

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Build and Publish
      run: |
        dotnet publish WinNetControl.csproj -c Release -p:WindowsAppSDKSelfContained=true -p:PublishSingleFile=true -p:PublishReadyToRun=true -v q

    - name: Compile Inno Setup Installer
      uses: minicomp/iscc-action@v1.0.3
      with:
        script: WinNetControl.iss

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WinNetControl-Installer
        path: Output/WinNetControl_Setup_*.exe

    - name: Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: Output/WinNetControl_Setup_*.exe
        generate_release_notes: true
